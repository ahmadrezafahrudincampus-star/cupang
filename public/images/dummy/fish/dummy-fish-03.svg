<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f201c" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#131410" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e0e0b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e87a0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e4e2dd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e9c176" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGlow)"/>
  
  <!-- Ambient Flowing Fin Layer (Back) -->
  <path d="M 350 480 Q 200 300 220 180 Q 380 260 450 420 Z" fill="url(#finGrad)" opacity="0.35" filter="url(#glow)"/>
  <path d="M 450 520 Q 650 350 620 220 Q 480 320 400 480 Z" fill="url(#finGrad)" opacity="0.4" filter="url(#glow)"/>
  <path d="M 400 550 Q 550 780 380 880 Q 320 720 380 560 Z" fill="url(#finGrad)" opacity="0.5" filter="url(#glow)"/>

  <!-- Main Caudal / Tail Sweep -->
  <path d="M 420 490 C 580 360, 680 500, 620 720 C 520 780, 440 680, 410 540 Z" fill="url(#finGrad)" opacity="0.85"/>

  <!-- Dorsal & Ventral Flowing Rays -->
  <path d="M 370 430 Q 300 260 380 200 Q 430 300 410 420 Z" fill="url(#finGrad)" opacity="0.75"/>
  <path d="M 340 540 Q 260 680 280 760 Q 350 680 360 550 Z" fill="#e9c176" opacity="0.7"/>

  <!-- Fish Body Core -->
  <path d="M 320 490 C 320 440, 390 430, 430 460 C 470 490, 450 530, 400 540 C 350 550, 320 530, 320 490 Z" fill="#1b1c18" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <ellipse cx="345" cy="480" rx="4" ry="4" fill="#e9c176"/>

  <!-- Subtle Shimmer Lines -->
  <path d="M 360 460 Q 400 480 430 470" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 350 485 Q 390 500 420 490" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>

  <!-- Editorial Card Framing -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Specimen Identity Badge -->
  <text x="60" y="880" font-family="'Bodoni Moda', serif" font-size="28" font-weight="600" fill="#e4e2dd" letter-spacing="0.5">Blue Rim Marble</text>
  <text x="60" y="915" font-family="'Hanken Grotesk', sans-serif" font-size="14" font-weight="500" fill="#e9c176" letter-spacing="3" text-transform="uppercase">Plakat HMPK &bull; BT-DEMO-003</text>
  <text x="740" y="915" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2" text-anchor="end">AQUATIC ART ARCHIVE</text>
</svg>