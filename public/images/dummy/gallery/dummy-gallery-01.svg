  <!-- Captions -->
  <text x="100" y="630" font-family="'Hanken Grotesk', sans-serif" font-size="14" font-weight="600" fill="#e9c176" letter-spacing="4">SECTION 01 &bull; BIO-FACILITY</text>
  <text x="100" y="670" font-family="'Bodoni Moda', serif" font-size="32" font-weight="600" fill="#e4e2dd">Archive Specimen Plate #1</text>
  <text x="1100" y="670" font-family="'Hanken Grotesk', sans-serif" font-size="14" fill="#9a8f80" text-anchor="end">Macro Lens 100mm &bull; Pure Black Studio Backdrop</text>
