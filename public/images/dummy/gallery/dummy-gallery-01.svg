<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1c18"/>
      <stop offset="100%" stop-color="#0e0e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#farmGrad)"/>
  
  <!-- Facility Geometric Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <line x1="100" y1="100" x2="1100" y2="100"/>
    <line x1="100" y1="700" x2="1100" y2="700"/>
    <rect x="150" y="180" width="260" height="340"/>
    <rect x="470" y="180" width="260" height="340"/>
    <rect x="790" y="180" width="260" height="340"/>
  </g>
  
  <!-- Water Glow Effect -->
  <circle cx="280" cy="350" r="80" fill="#e9c176" opacity="0.08"/>
  <circle cx="600" cy="350" r="80" fill="#e9c176" opacity="0.08"/>
  <circle cx="920" cy="350" r="80" fill="#e9c176" opacity="0.08"/>

  <!-- Framing -->
